[veritas]
budget_seconds = 90
write_generated_tests = true
fail_on_generated_test_failure = true
fail_on_findings = false

[planner]
mode = "deterministic"

[plugins.go]
fuzz_seconds = 1
fuzz_existing = true
coverage_enabled = false
reverse_dependency_depth = 1
max_fuzz_targets = 4
command_timeout_seconds = 90
max_packages = 8
max_mutants = 4
build_tags = []
