[veritas]
budget_seconds = 90
write_generated_tests = true
fail_on_generated_test_failure = true
fail_on_findings = false

[planner]
mode = "deterministic"

[plugins.rust]
property_framework = "proptest"
coverage_enabled = false
command_timeout_seconds = 90
cargo_jobs = 1
test_threads = 1
systemd_scope = false
