[workspace]
members = [
    "crates/veritas-cli",
    "crates/veritas-core",
    "crates/veritas-plugin-api",
    "crates/veritas-rust",
    "crates/veritas-go",
    "crates/veritas-report",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/Jacobious52/veritas"
homepage = "https://github.com/Jacobious52/veritas"
readme = "README.md"
keywords = ["ai", "verification", "testing", "fuzzing", "cli"]
categories = ["command-line-utilities", "development-tools::testing"]
description = "Adversarial verification harness for AI-written and AI-modified software"

[workspace.dependencies]
anyhow = "1.0"
camino = { version = "1.1", features = ["serde1"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tree-sitter = "0.25"
walkdir = "2.5"

[workspace.metadata.veritas]
name = "veritas"
