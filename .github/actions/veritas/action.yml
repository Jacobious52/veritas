name: Veritas
description: Install and run Veritas verification for AI-modified code.

inputs:
  args:
    description: Arguments passed to veritas.
    required: false
    default: verify --changed --profile ci
  repair-prompt:
    description: Append veritas repair-prompt output to the GitHub step summary.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install Veritas
      shell: bash
      run: cargo install veritas-cli --locked

    - name: Run Veritas
      shell: bash
      run: veritas ${{ inputs.args }}

    - name: Write repair prompt
      if: ${{ inputs['repair-prompt'] == 'true' }}
      shell: bash
      run: veritas repair-prompt --github-step-summary
