name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package crates without uploading"
        required: true
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable

      - name: Format
        run: cargo fmt --all -- --check

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Package crates
        run: ./scripts/publish-crates.sh --dry-run

      - name: Install smoke
        run: |
          cargo install --path crates/veritas-cli --locked --force
          veritas --help
          veritas scan --root fixtures/sample-rust

  publish:
    name: Publish crates.io
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Check crates.io token
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error title=Missing CARGO_REGISTRY_TOKEN::Set the repository Actions secret named CARGO_REGISTRY_TOKEN before publishing."
            exit 1
          fi

      - name: Publish crates
        run: ./scripts/publish-crates.sh --execute
