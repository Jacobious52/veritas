name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package crates without uploading"
        required: true
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  validate:
    name: Validate and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable

      - name: Format
        run: cargo fmt --all -- --check

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Installer syntax
        run: sh -n install.sh

      - name: SBOM generation smoke
        run: python3 scripts/generate-release-sbom.py target/veritas-sbom.cdx.json

      - name: Package crates
        run: ./scripts/publish-crates.sh --dry-run

      - name: Install smoke
        run: |
          cargo install --path crates/veritas-cli --locked --force
          veritas --help
          veritas scan --root fixtures/sample-rust

  binaries:
    name: Build binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            native_smoke: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            native_smoke: false
          - os: macos-14
            target: x86_64-apple-darwin
            native_smoke: false
          - os: macos-14
            target: aarch64-apple-darwin
            native_smoke: true
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - name: Install Linux ARM linker
        if: ${{ matrix.target == 'aarch64-unknown-linux-gnu' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build -p veritas-cli --locked --release --target "${{ matrix.target }}"

      - name: Native smoke
        if: ${{ matrix.native_smoke }}
        run: |
          host_arch="$(uname -m)"
          case "${{ matrix.target }}" in
            x86_64-*) [ "$host_arch" = "x86_64" ] || exit 0 ;;
            aarch64-*) [ "$host_arch" = "arm64" ] || [ "$host_arch" = "aarch64" ] || exit 0 ;;
          esac
          "target/${{ matrix.target }}/release/veritas" --help
          "target/${{ matrix.target }}/release/veritas" scan --root fixtures/sample-rust

      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          asset="veritas-${{ matrix.target }}.tar.gz"
          mkdir -p dist/pkg
          cp "target/${{ matrix.target }}/release/veritas" dist/pkg/veritas
          chmod +x dist/pkg/veritas
          cp README.md dist/pkg/README.md
          tar -C dist/pkg -czf "dist/${asset}" veritas README.md
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "dist/${asset}" > "dist/${asset}.sha256"
          else
            shasum -a 256 "dist/${asset}" > "dist/${asset}.sha256"
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: veritas-${{ matrix.target }}
          path: |
            dist/veritas-${{ matrix.target }}.tar.gz
            dist/veritas-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  github-release:
    name: Upload GitHub Release assets
    runs-on: ubuntu-latest
    needs: binaries
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v5

      - name: Download packaged binaries
        uses: actions/download-artifact@v4
        with:
          pattern: veritas-*
          path: dist/release
          merge-multiple: true

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate-release-sbom.py dist/release/veritas-sbom.cdx.json
          cp install.sh dist/release/install.sh
          chmod 755 dist/release/install.sh
          cd dist/release
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum veritas-*.tar.gz install.sh veritas-sbom.cdx.json > veritas-checksums.txt
          else
            shasum -a 256 veritas-*.tar.gz install.sh veritas-sbom.cdx.json > veritas-checksums.txt
          fi

      - name: Attest release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/release/*"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/release/* --clobber
          else
            gh release create "$tag" dist/release/* --title "$tag" --generate-notes
          fi

  publish:
    name: Publish crates.io
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Check crates.io token
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error title=Missing CARGO_REGISTRY_TOKEN::Set the repository Actions secret named CARGO_REGISTRY_TOKEN before publishing."
            exit 1
          fi

      - name: Publish crates
        run: ./scripts/publish-crates.sh --execute
