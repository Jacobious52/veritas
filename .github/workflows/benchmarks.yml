name: Benchmarks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/benchmarks.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "examples/**"
      - "docs/confidence.md"

permissions:
  contents: read

jobs:
  seeded-examples:
    name: Seeded examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Check Go
        run: go version

      - name: Run seeded benchmark suite
        run: cargo run -p veritas-cli --locked -- --root examples bench --format json
