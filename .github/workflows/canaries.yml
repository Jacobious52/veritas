name: External Canaries

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Canary depth"
        required: true
        type: choice
        default: smoke
        options:
          - smoke
          - verify
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

jobs:
  canaries:
    name: Pinned external repositories
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERITAS_CANARY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'smoke' }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Check Go
        run: go version

      - name: Build veritas
        run: cargo build -p veritas-cli --locked

      - name: Run canaries
        env:
          VERITAS_BIN: ${{ github.workspace }}/target/debug/veritas
        run: ./scripts/run-canaries.sh "${VERITAS_CANARY_MODE}"

      - name: Upload canary dashboard
        uses: actions/upload-artifact@v4
        with:
          name: veritas-canary-dashboard-${{ env.VERITAS_CANARY_MODE }}
          path: |
            target/external-fixtures/reports/canary-dashboard.md
            target/external-fixtures/reports/canary-summary.json
            target/external-fixtures/reports/*-scan.json
            target/external-fixtures/reports/*-report.json
            target/external-fixtures/reports/*-verify.md
          if-no-files-found: error
