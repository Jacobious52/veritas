[veritas]
budget_seconds = 60
write_generated_tests = true
fail_on_generated_test_failure = true
fail_on_findings = false

[planner]
mode = "deterministic"

[plugins.go]
fuzz_seconds = 2
fuzz_concurrency = 2
coverage_enabled = false
command_timeout_seconds = 60
max_fuzz_targets = 12
max_mutants = 6
