profile = "large-repo"

[[case]]
name = "rust-risk-suite-confidence"
path = "rust-risk-suite"
language = "rust"
target = "src/lib.rs"
expect_artifacts = ["mutation_check", "assertion_candidate", "mutation_trend", "evolution_candidate"]
expect_commands = ["cargo test"]
min_commands = 2
min_mutants_executed = 4
min_mutation_score = 40
min_assertion_candidates = 1
min_replay_cases = 1
min_evolution_candidates = 3
max_duration_ms = 90000

